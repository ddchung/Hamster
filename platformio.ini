; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

build_unflags =
    -fpermissive
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -O0
    -O1
    -O2
    -O3
    -Os
    -Oz
    
build_flags =
    -std=gnu++20
    -Wall
    -Wno-ignored-qualifiers
    -Wno-unused-parameter
    -Wno-maybe-musttail-local-addr

    ; arduino causes a lot of these
    -Wno-volatile

    -Wno-format

    -Ofast
    -fno-strict-aliasing
    -funroll-loops
    -DUSB_TRIPLE_SERIAL
    -DNDEBUG

    ; also don't use these on arduino
    ; -Wpedantic
    ; -Wextra
lib_deps = 
    SdFat ; Arduino's SD is too slow, and doesn't support many features
    https://github.com/pavel-kirienko/o1heap

; use teensy cli instead of teensy gui
upload_protocol = teensy-cli

board_build.ldscript = teensy4.ld
; WARNING: you MUST use additional cooling, such as a small heatsink with this overclock
; If you do not want to use cooling, set this back to 600000000
; Or, if you're feeling adventurous, you can try one of these clocks:
; 600MHz    | 528MHz    | 450MHz    | 396MHz    | 150MHz    | 24MHz    | 720MHz    | 816MHz    | 912MHz    | 960MHz    | 1.008GHz
; 600000000 | 528000000 | 450000000 | 396000000 | 150000000 | 24000000 | 720000000 | 816000000 | 912000000 | 960000000 | 1008000000
;
; board_build.f_cpu = 816000000 ; overclock to 816MHz, from stock 600MHz
board_build.f_cpu = 600000000 ; stock 600MHz

[env:native]
platform = native

build_flags =
    -fno-exceptions ; mimic Arduino's behavior
    -fno-rtti ; mimic Arduino's behavior
    -g
    -O0
    -fsanitize=address
    -fsanitize=undefined
    -std=gnu++20
    -Wall
    -Wextra
    -Wpedantic
    -Wno-ignored-qualifiers
    -Wno-unused-parameter
    -Wno-maybe-musttail-local-addr

[env:teensy41_release]
extends = env:teensy41
build_type = release
build_flags =
    -std=gnu++20
    -Wall
    -Wno-ignored-qualifiers
    -Wno-unused-parameter
    -Wno-maybe-musttail-local-addr

    ; arduino causes a lot of these
    -Wno-volatile

    -Wno-format

    -Ofast
    -fno-strict-aliasing
    -funroll-loops
    -DUSB_DUAL_SERIAL
    -DNDEBUG
    -DNTRACE

[env:native_release]
platform = native
build_flags =
    -fno-exceptions ; mimic Arduino's behavior
    -fno-rtti ; mimic Arduino's behavior
    -Ofast
    -march=native
    -funroll-loops
    -std=gnu++20
    -DNDEBUG
    -DNTRACE
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    -Wno-ignored-qualifiers
    -Wno-unused-parameter
    -Wno-maybe-musttail-local-addr
