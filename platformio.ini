; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; ==================================================

[all]
build_flags =
    -std=gnu++20
    -Wall
    -Wno-ignored-qualifiers
    -Wno-unused-parameter
    -Wno-maybe-musttail-local-address
    -fno-exceptions
    -fno-rtti

build_unflags =
    -fpermissive
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -O0
    -O1
    -O2
    -O3
    -Os
    -Oz

extra_scripts =
    pre:hamster_platform.py

; build_src_filter is relative to both /src and /port/{hamster_platform}
build_src_filter =
    +<**/*.c>
    +<**/*.cpp>
    +<**/*.asm>
    +<**/*.s>
    +<**/*.S>

[debug]
build_flags =
    ${all.build_flags}
    -O0
    -g

[release]
build_flags =
    ${all.build_flags}
    -Ofast
    -fno-strict-aliasing
    -DNDEBUG
    -DNTRACE

; ==================================================

[env:native]
platform = native
extends = all, debug
hamster_platform = native

build_flags =
    ${debug.build_flags}
    -fsanitize=address
    -fsanitize=undefined
    -Wextra
    -Wpedantic

[env:native_release]
extends = native, all, release

build_flags =
    ${release.build_flags}
    -Wextra
    -Wpedantic

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
extends = all, debug
hamster_platform = teensy4

build_flags =
    ${debug.build_flags}
    ; arduino causes a lot of these
    -Wno-volatile
    -Wno-format
    -DUSB_TRIPLE_SERIAL
lib_deps = 
    SdFat ; Arduino's SD is too slow, and doesn't support many features
    https://github.com/pavel-kirienko/o1heap


board_build.ldscript = teensy4.ld

; Possible clocks:
; !! WARNING: 816MHz and above REQUIRE cooling !!
; 600MHz    | 528MHz    | 450MHz    | 396MHz    | 150MHz    | 24MHz    | 720MHz    | 816MHz    | 912MHz    | 960MHz    | 1.008GHz
; 600000000 | 528000000 | 450000000 | 396000000 | 150000000 | 24000000 | 720000000 | 816000000 | 912000000 | 960000000 | 1008000000
;
; board_build.f_cpu = 816000000 ; overclock to 816MHz, from stock 600MHz
board_build.f_cpu = 600000000 ; stock 600MHz

[env:teensy41_release]
extends = env:teensy41, all, release
build_flags =
    ${release.build_flags}
    -Wno-volatile
    -Wno-format
    -DUSB_DUAL_SERIAL
