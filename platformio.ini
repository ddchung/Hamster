; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

build_unflags =
    -fpermissive
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -O0
    -O1
    -O2
    -O3
    -Os
    -Oz
    
build_flags =
    -std=gnu++20
    -Wall
    -Wno-ignored-qualifiers
    -Wno-unused-parameter

    ; arduino causes a lot of these
    -Wno-volatile

    -Wno-format

    -Ofast
    -fno-strict-aliasing
    -funroll-loops

    ; also don't use these on arduino
    ; -Wpedantic
    ; -Wextra
lib_deps = 
    SdFat ; Arduino's SD is too slow, and doesn't support many features

[env:native]
platform = native

build_flags =
    -fno-exceptions ; mimic Arduino's behavior
    -fno-rtti ; mimic Arduino's behavior
    -g
    -O0
    -fsanitize=address
    -fsanitize=undefined
    -std=gnu++20
    -Wall
    -Wextra
    -Wpedantic
    -Wno-ignored-qualifiers
    -Wno-unused-parameter

[env:teensy41_release]
platform = teensy
board = teensy41
framework = arduino

build_unflags =
    -fpermissive
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -O0
    -O1
    -O2
    -O3
build_flags =
    -std=gnu++20
    -Ofast ; may switch to Os or Oz if it is too big
    -Wall
    -Wno-ignored-qualifiers
    -Wno-unused-parameter
    -Wno-volatile
    -DNDEBUG


[env:native_release]
platform = native
build_flags =
    -fno-exceptions ; mimic Arduino's behavior
    -fno-rtti ; mimic Arduino's behavior
    -Ofast
    -march=native
    -funroll-loops
    -std=gnu++20
    -DNDEBUG
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    -Wno-ignored-qualifiers
    -Wno-unused-parameter
